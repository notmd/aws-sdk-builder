[workspace]
members = [
    "crates/aws-sdk-build",
    "crates/aws-sdk-conformance",
    "examples/my_aws_sdk",
]
resolver = "2"

[profile.dev.package.syn]
opt-level = 3

[profile.dev.package.diffy]
opt-level = 3

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/notmd/better-aws"
