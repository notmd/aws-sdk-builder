[package]
name = "aws-sdk-conformance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "All-operation AWS SDK snapshot generation and deterministic source conformance reports."
publish = false

[dependencies]
aws-sdk-builder = { path = "../aws-sdk-builder" }
aws-sdk-builder-dynamodb = { path = "../aws-sdk-builder-dynamodb" }
aws-sdk-builder-iam = { path = "../aws-sdk-builder-iam" }
aws-sdk-builder-kms = { path = "../aws-sdk-builder-kms" }
aws-sdk-builder-lambda = { path = "../aws-sdk-builder-lambda" }
aws-sdk-builder-s3 = { path = "../aws-sdk-builder-s3" }
aws-sdk-builder-sns = { path = "../aws-sdk-builder-sns" }
aws-sdk-builder-sqs = { path = "../aws-sdk-builder-sqs" }
aws-sdk-builder-sts = { path = "../aws-sdk-builder-sts" }
diffy = { version = "0.5.1", features = ["std"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
tempfile = "3"
