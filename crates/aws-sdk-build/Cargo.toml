[package]
name = "aws-sdk-build"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust-native build-time generation of modular AWS SDK clients."
include = ["Cargo.toml", "src/**", "models/**", "models-manifest.json", "README.md", "LICENSE*"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
syn = { version = "2", features = ["full", "parsing"] }
tempfile = "3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
