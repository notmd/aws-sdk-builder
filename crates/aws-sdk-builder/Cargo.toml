[package]
name = "aws-sdk-builder"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust-native build-time generation of modular AWS SDK clients."
include = [
    "Cargo.toml",
    "src/**",
    "assets/**",
    "README.md",
    "LICENSE*",
]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
