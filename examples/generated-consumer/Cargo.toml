[workspace]

[package]
name = "generated-consumer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aws-credential-types = "1.3.0"
aws-runtime = { version = "1.9.1", features = ["http-1x"] }
aws-runtime-api = "1.2.0"
aws-sigv4 = "1.5.1"
aws-smithy-async = "1.3.0"
aws-smithy-http = "0.64.0"
aws-smithy-http-client = "1.4.0"
aws-smithy-json = "0.63.0"
aws-smithy-observability = "0.3.0"
aws-smithy-runtime = { version = "1.14.0", features = ["client"] }
aws-smithy-runtime-api = { version = "1.15.0", features = ["client", "http-1x"] }
aws-smithy-schema = "0.2.0"
aws-smithy-types = { version = "1.6.2", features = ["http-body-1-x"] }
aws-types = "1.5.0"
bytes = "1"
fastrand = "2.3.0"
http-1x = { package = "http", version = "1.3.1" }
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"

[build-dependencies]
aws-sdk-build = { path = "../../crates/aws-sdk-build" }
